# Mods the launcher can download and install with one click.
#
# Scope: only the "regular" mods fallout2-ce's own README lists as explicitly
# supported (https://github.com/fallout2-ce/fallout2-ce) and that install as a
# flat drop-in under mods/ — no total conversions (Restoration Project, Fallout
# et Tu, Sonora, ...), those need their own installer and are out of scope here.
#
# `github = "owner/repo"` resolves to that repo's latest release at runtime and
# picks the first asset matching `asset` (an fnmatch pattern, default "*.zip").
# `raw = "<url>"` instead fetches that single file directly, no release lookup.
# Either way the downloaded zip's "mods/" contents are copied into mods/ as-is
# (everything else in the archive, e.g. a Windows ddraw.dll, is ignored).
#
# `dat` lists the file(s) in mods/ that mean this entry is already installed.
# `ini` is its settings file, if any — removed together with `dat` on Delete.
#
# `campaigns` scopes which campaigns' Mods pages offer this entry as a download
# (default: ["ce"]). fallout2-ce's own README calls out Et Tu as "Full Support",
# so entries it also names as working out of the box (Party Orders, FO2Tweaks)
# are scoped to "ettu" too — see the Et Tu additional-content research this was
# added from.
#
# `extract_to` is for an entry that isn't a drop-in-mods/-and-toggle "mod" at
# all — it's content CE reads directly from that campaign-relative folder, so
# the zip's files land there as-is (no mods/ prefix to strip) and there's no
# mods_order.txt line. HQ Music is scoped to "ettu" only because Et Tu's own
# fallout2.cfg already points music_path1 at data/sound/music/ — Vanilla/CE's
# default (sound/music/, no data/ prefix) doesn't match, so this would land in
# the wrong place there until that's handled per-campaign too.

[[entry]]
id = "npc-armor"
name = "NPC Armor"
description = "Armor changes are visible on NPC sprites, not just the player's."
homepage = "https://github.com/BGforgeNet/Fallout2_NPC_Armor"
github = "BGforgeNet/Fallout2_NPC_Armor"
dat = ["npc_armor.dat"]
ini = "npcarmor.ini"

[[entry]]
id = "party-orders"
name = "Party Orders"
description = "Hotkeys to command companions: follow/wait, combat behavior, auto-loot."
homepage = "https://github.com/BGforgeNet/Fallout2_Party_Orders"
github = "BGforgeNet/Fallout2_Party_Orders"
dat = ["party_orders.dat"]
ini = "party_orders.ini"
campaigns = ["ce", "ettu"]

[[entry]]
id = "fo2tweaks"
name = "FO2Tweaks"
description = "Collection of convenience tweaks, quality-of-life changes and optional cheats."
homepage = "https://github.com/BGforgeNet/FO2tweaks"
github = "BGforgeNet/FO2tweaks"
dat = ["fo2tweaks.dat"]
ini = "fo2tweaks.ini"
campaigns = ["ce", "ettu"]

[[entry]]
id = "f2-res"
name = "High Resolution Patch (f2_res.dat)"
description = "Graphics assets CE needs for the expanded interface bar and barter window."
homepage = "https://github.com/fallout2-ce/fallout2-ce"
raw = "https://github.com/fallout2-ce/fallout2-ce/raw/refs/heads/main/files/f2_res.dat"
dat = ["f2_res.dat"]

[[entry]]
id = "hq-music"
name = "High Quality Music"
description = "44.1 kHz music (~370MB), replacing Et Tu's default 22 kHz tracks by filename."
homepage = "https://github.com/BGforgeNet/Fallout2-HQ-music"
github = "BGforgeNet/Fallout2-HQ-music"
asset = "*hq*.zip"
extract_to = "data/sound/music"
campaigns = ["ettu"]
dat = [
    "01hub.acm", "02mstrlr.acm", "03world.acm", "03wrldmp.acm", "04brthrh.acm", "05raider.acm",
    "06vault.acm", "07desert.acm", "08vats.acm", "09glow.acm", "10labone.acm", "11chilrn.acm",
    "12junktn.acm", "13carvrn.acm", "14necro.acm", "15shady.acm", "16follow.acm", "17arroyo.acm",
    "18modoc.acm", "19reno.acm", "20car.acm", "21sf.acm", "22vcity.acm", "23world.acm",
    "24redd.acm", "abbey1.acm", "akiss.acm", "maybe.acm", "prmtribe.acm", "wind1.acm", "wind2.acm",
]
