# Schema for FO2Tweaks (https://github.com/BGforgeNet/fo2tweaks), written against v14.7.
# Defaults are the values FO2Tweaks ships with. Keys not listed here (item PID lists,
# per-NPC tables) are left for advanced users to edit in mods/fo2tweaks.ini directly.
page = "FO2Tweaks"
intro = "Convenience tweaks, fixes and optional cheats by BGforge. Changes apply the next time you load a save."

[files]
fo2tweaks = "mods/fo2tweaks.ini"

[[mod]]
dat = "fo2tweaks.dat"
description = "FO2Tweaks — convenience tweaks, fixes and optional cheats"

[[group]]
name = "Combat"
file = "fo2tweaks"
section = "main"

[[group.setting]]
key = "hp_over_head"
label = "Show HP over heads in combat"
type = "bool"
default = "0"
help = "Floating HP numbers over you, your party and nearby enemies. FO2Tweaks notes there is some delay."

[[group.setting]]
section = "hp_over_head"
key = "key"
label = "HP over heads key"
type = "text"
default = "V"
help = "A letter key: HP is shown once per tap. Leave empty to show it all the time."
enabled_if = { setting = "fo2tweaks:main:hp_over_head", equals = ["1"] }

[[group.setting]]
section = "hp_over_head"
key = "only_party"
label = "HP over heads for party members only"
type = "bool"
default = "0"
enabled_if = { setting = "fo2tweaks:main:hp_over_head", equals = ["1"] }

[[group.setting]]
key = "ap_rollover"
label = "Carry over unused action points"
type = "int"
default = "2"
min = 0
max = 10
slider = true
suffix = " AP"
help = "Up to this many unused AP carry over to your next turn, replacing the armor class bonus for unused AP. 0 = original rules."
note = "Changes game balance."

[[group.setting]]
key = "damage_mod"
label = "AP/JHP ammo damage rework"
type = "bool"
default = "1"
help = "Fixes the original's broken armor-piercing and hollow-point ammo. Needs the original damage formula (Combat & Balance → Damage formula)."
note = "Changes game balance."

[[group.setting]]
section = "damage_mod"
key = "damage_difficulty"
label = "Damage multiplier"
type = "choice"
default = "0"
options = [["0", "Tied to combat difficulty (original)"], ["1", "Wimpy (75%)"], ["2", "Normal (100%)"], ["3", "Rough (125%)"]]
help = "Separates damage from the combat difficulty option, which then only affects enemy aim and AI."
enabled_if = { setting = "fo2tweaks:main:damage_mod", equals = ["1"] }

[[group.setting]]
section = "damage_mod"
key = "party_scale_damage"
label = "Difficulty scales your party's damage too"
type = "bool"
default = "0"
help = "Normally only enemy damage changes with difficulty."
enabled_if = { setting = "fo2tweaks:main:damage_mod", equals = ["1"] }

[[group.setting]]
key = "improved_grenades"
label = "Improved grenades"
type = "bool"
default = "1"
help = "Grenades ignore target AC and can be thrown at empty tiles."

[[group.setting]]
key = "molotov_fire"
label = "Molotovs do fire damage"
type = "bool"
default = "1"

[[group.setting]]
key = "no_scope_penalty"
label = "No close-range penalty for scoped weapons"
type = "bool"
default = "1"

[[group.setting]]
key = "max_knockback"
label = "Maximum knockback"
type = "int"
default = "-1"
min = -1
max = 20
suffix = " hexes"
help = "-1 = unlimited (original), 0 = no knockback."

[[group.setting]]
key = "auto_reload"
label = "Reload both weapons after combat"
type = "bool"
default = "1"

[[group.setting]]
key = "ammobox"
label = "Show current ammo type during combat"
type = "bool"
default = "1"

[[group.setting]]
key = "auto_cursor"
label = "Switch cursor automatically on mouseover in combat"
type = "bool"
default = "0"

[[group.setting]]
key = "no_drop_items_on_death"
label = "Keep loot on melted, exploded or burned enemies"
type = "bool"
default = "1"
help = "Their remains can be looted normally instead of the inventory spilling on the ground."

[[group]]
name = "Party"
file = "fo2tweaks"
section = "main"

[[group.setting]]
key = "unlimited_party"
label = "No Charisma limit on party size"
type = "bool"
default = "0"
help = "Other joining conditions (karma, quests) still apply. Covers all original and Restoration Project companions."

[[group.setting]]
key = "party_level_match"
label = "Companions level closer to your level"
type = "bool"
default = "0"

[[group.setting]]
key = "modoc_brahmin"
label = "Protect Modoc's brahmin from your companions"
type = "bool"
default = "1"

[[group.setting]]
key = "run_speed"
label = "Faster running"
type = "bool"
default = "0"
help = "Helps slow companions keep up."
note = "Needs an sfall file-system option that Fallout 2 CE may not support."

[[group.setting]]
section = "run_speed"
key = "dude"
label = "Faster running for you"
type = "bool"
default = "1"
enabled_if = { setting = "fo2tweaks:main:run_speed", equals = ["1"] }

[[group.setting]]
section = "run_speed"
key = "party"
label = "Faster running for companions"
type = "bool"
default = "1"
enabled_if = { setting = "fo2tweaks:main:run_speed", equals = ["1"] }

[[group]]
name = "Highlighting"
file = "fo2tweaks"
section = "highlighting"

[[group.setting]]
section = "main"
key = "highlighting"
label = "FO2Tweaks highlighting"
type = "bool"
default = "1"
help = "Outlines locked doors and containers, traps, party members and exits, and skips empty containers."
note = "Replaces the standard highlighting: set Companions & Highlights → Highlight key to None while this is on."

[[group.setting]]
key = "key"
label = "Highlight key"
type = "key"
default = "42"
enabled_if = { setting = "fo2tweaks:main:highlighting", equals = ["1"] }

[[group.setting]]
key = "check_los"
label = "Only what your character can see"
type = "bool"
default = "0"
enabled_if = { setting = "fo2tweaks:main:highlighting", equals = ["1"] }

[[group.setting]]
key = "skip_empty"
label = "Skip empty containers and corpses"
type = "bool"
default = "1"
enabled_if = { setting = "fo2tweaks:main:highlighting", equals = ["1"] }

[[group.setting]]
key = "motion_scanner"
label = "Motion Sensor requirement"
type = "choice"
default = "0"
options = [["0", "Not needed"], ["1", "Needs a Motion Sensor"], ["2", "Needs a Motion Sensor, uses a charge"]]
enabled_if = { setting = "fo2tweaks:main:highlighting", equals = ["1"] }

