key = "color_items"
label = "Items"
type = "choice"
default = "16"
options = [["0", "Off"], ["1", "Glowing red"], ["2", "Red"], ["4", "Grey"], ["8", "Glowing green"], ["16", "Bright yellow"], ["32", "Dark yellow"], ["64", "Purple"]]
enabled_if = { setting = "fo2tweaks:main:highlighting", equals = ["1"] }

