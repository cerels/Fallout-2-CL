[[group]]
name = "Interface & hotkeys"
file = "fo2tweaks"
section = "main"

[[group.setting]]
key = "worldmap_key"
label = "World map key"
type = "text"
default = "W"
help = "A letter key. 0 disables it."

[[group.setting]]
key = "townmap_key"
label = "Town map key"
type = "text"
default = "Y"
help = "A letter key. 0 or T keeps the default T key."

[[group.setting]]
key = "keymap"
label = "Remap save/load keys"
type = "bool"
default = "1"
help = "F5 = quick save, F8 = quick load, F9 = load game, J = center on player. The keys they replace stop working."

[[group.setting]]
key = "autodoors"
label = "FO2Tweaks auto-doors"
type = "choice"
default = "1"
options = [["0", "Off"], ["1", "Open unlocked doors"], ["2", "Open, and close them again behind you"]]
note = "Your Fallout 2 CE build has its own auto-doors (Gameplay → Open doors automatically). Use only one of the two."

[[group.setting]]
key = "min_light_level"
label = "Minimum map brightness"
type = "int"
default = "0"
min = 0
max = 100
slider = true
suffix = " %"
help = "Dark maps never get darker than this. FO2Tweaks recommends 49. 0 = off."

[[group]]
name = "Healing & leveling"
file = "fo2tweaks"
section = "main"

[[group.setting]]
key = "healing_revision"
label = "Reworked healing"
type = "bool"
default = "1"

[[group.setting]]
section = "healing_revision"
key = "living_anatomy_min_doctor"
label = "Free Living Anatomy perk at Doctor skill"
type = "int"
default = "135"
min = 0
max = 301
suffix = " %"
help = "Over 300 disables the free perk."
enabled_if = { setting = "fo2tweaks:main:healing_revision", equals = ["1"] }

[[group.setting]]
key = "gigolo_limit"
label = "Partners needed for the Gigolo title"
type = "int"
default = "0"
min = 0
max = 20
help = "0 = original rules."

[[group]]
name = "Cheats"
file = "fo2tweaks"
section = "main"

[[group.setting]]
key = "carry_weight"
label = "Unlimited carry weight"
type = "bool"
default = "0"

[[group.setting]]
key = "trunk_space"
label = "Bottomless car trunk"
type = "bool"
default = "0"

[[group.setting]]
key = "level5"
label = "Level 5 after the Temple of Trials"
type = "bool"
default = "0"

[[group.setting]]
key = "speedup"
label = "Overall game speedup"
type = "bool"
default = "0"
note = "FO2Tweaks says to read its readme before enabling this."
