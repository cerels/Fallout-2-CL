[package]
name = "f2launcher"
version = "0.1.3"
edition = "2024"
license = "MIT"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
toml = "0.8"
regex = "1"
indexmap = "2"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
egui = "0.37.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17.2"

[dev-dependencies]
tempfile = "3"
