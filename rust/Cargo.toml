[package]
name = "f2launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
toml = "0.8"
regex = "1"
indexmap = "2"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
