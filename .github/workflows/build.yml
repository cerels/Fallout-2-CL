name: Build launcher binaries

# Builds the Rust launcher (rust/) natively per OS and attaches the binaries to a GitHub
# Release. The schemas, fonts and icon are baked in with include_str!/include_bytes!, so
# each binary is a single self-contained file. Pushing a tag like v0.1.1 runs the release;
# workflow_dispatch just builds and uploads workflow artifacts (no release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest so the binary links against an older glibc and
          # runs on more distros (SteamOS included).
          - os: ubuntu-22.04
            artifact: f2launcher-linux
          - os: windows-latest
            artifact: f2launcher-windows.exe
          - os: macos-latest
            artifact: f2launcher-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$crate_version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} doesn't match Cargo.toml version $crate_version"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS ships a universal (Intel + Apple Silicon) binary, built per-arch and lipo'd.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        run: cargo test --locked --release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release
          mv target/release/f2launcher "../${{ matrix.artifact }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --release
          mv target/release/f2launcher.exe "../${{ matrix.artifact }}"

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create -output "../${{ matrix.artifact }}" \
            target/aarch64-apple-darwin/release/f2launcher \
            target/x86_64-apple-darwin/release/f2launcher

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Restore exec bit on Unix binaries
        run: chmod +x dist/f2launcher-linux dist/f2launcher-macos

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
